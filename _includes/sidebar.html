<!--
  sidebar.html - sidebar ad albero con categorie espandibili (freccetta)
  Creato perché mancava dal repo (causava crash su single.html che la richiama
  con {% include sidebar.html %}).
  NON tocca il menu top originale (_data/navigation.yml).
  <details>/<summary> nativi HTML: toggle senza bisogno di JS.
  TEST: solo "Tecnica" ha sotto-voci (2 finte), per verificare che la freccetta
  funzioni prima di replicare su tutte le categorie.
-->
<style>
.cp3-sidebar { font-size: 14px; margin: 20px 0; }
.cp3-nav-list { list-style: none; margin: 0; padding: 0; }
.cp3-nav-item { margin-bottom: 4px; }
.cp3-nav-toggle {
  cursor: pointer;
  padding: 6px 8px;
  border-radius: 6px;
  font-weight: 600;
  list-style: none;
  display: flex;
  align-items: center;
  gap: 6px;
  color: #333;
}
.cp3-nav-toggle::-webkit-details-marker { display: none; }
.cp3-arrow {
  display: inline-block;
  font-size: 10px;
  color: #999;
  transition: transform .15s;
}
details[open] > .cp3-nav-toggle .cp3-arrow { transform: rotate(90deg); }
.cp3-nav-toggle:hover { background: #f5f5ff; }
.cp3-nav-sublist { list-style: none; margin: 2px 0 6px 22px; padding: 0; }
.cp3-nav-sublist li a {
  display: block;
  padding: 5px 8px;
  font-size: 13px;
  color: #666;
  text-decoration: none;
  border-radius: 6px;
}
.cp3-nav-sublist li a:hover { background: #f5f5ff; color: #6c63ff; }
</style>

<nav class="cp3-sidebar" aria-label="Categorie">
  <ul class="cp3-nav-list">
    <li class="cp3-nav-item cp3-has-children">
      <details open>
        <summary class="cp3-nav-toggle">
          <span class="cp3-arrow">&#9656;</span> Tecnica
        </summary>
        <ul class="cp3-nav-sublist">
          <li><a href="{{ site.baseurl }}/categories/#tecnica">Tutti gli articoli</a></li>
          <li><a href="{{ site.baseurl }}/categories/#tecnica">Guide (test)</a></li>
          <li><a href="{{ site.baseurl }}/categories/#tecnica">Tutorial (test)</a></li>
        </ul>
      </details>
    </li>
  </ul>
</nav>
